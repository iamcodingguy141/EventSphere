<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover events, book tickets and organize experiences with EventSphere.">
  <title>Event calendar | EventSphere</title>
  <link rel="icon" href="images/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="calendar">

  <header id="site-header"></header>
